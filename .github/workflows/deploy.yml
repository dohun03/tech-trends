name: Validate and Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      target:
        description: '배포할 인스턴스'
        required: true
        type: choice
        options:
          - front
          - back

concurrency:
  group: tech-trends-deploy-${{ github.event.inputs.target || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Validate deployment configuration
        run: |
          FRONT_ENV_FILE=.env.front.example docker compose --env-file .env.front.example -f docker-compose.front.yml config --quiet
          docker compose --env-file .env.back.example -f docker-compose.back.yml config --quiet
          bash -n scripts/backup-postgres-to-s3.sh

  deploy-front:
    name: Deploy Front
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'front'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONT_SSH_HOST }}
          username: ${{ secrets.FRONT_SSH_USERNAME }}
          key: ${{ secrets.FRONT_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/app"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/dohun03/tech-trends.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            umask 077
            cat <<'EOF' > .env.front
            ${{ secrets.FRONT_ENV_FILE }}
            EOF

            docker compose --env-file .env.front -f docker-compose.front.yml config --quiet
            docker compose --env-file .env.front -f docker-compose.front.yml up -d --build --remove-orphans
            docker compose --env-file .env.front -f docker-compose.front.yml ps
            curl --fail --retry 10 --retry-connrefused --retry-delay 3 \
              'http://127.0.0.1/api/trends?limit=1' >/dev/null
            docker image prune -f

  deploy-back:
    name: Deploy Back
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'back'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACK_SSH_HOST }}
          username: ${{ secrets.BACK_SSH_USERNAME }}
          key: ${{ secrets.BACK_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/app"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/dohun03/tech-trends.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            umask 077
            cat <<'EOF' > .env.back
            ${{ secrets.BACK_ENV_FILE }}
            EOF

            docker compose --env-file .env.back -f docker-compose.back.yml config --quiet
            docker compose --env-file .env.back -f docker-compose.back.yml up -d
            docker compose --env-file .env.back -f docker-compose.back.yml ps
