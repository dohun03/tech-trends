version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tech-trends-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-trends-backend
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_CACHE_HOST=redis-cache
      - REDIS_CACHE_PORT=6379
      - REDIS_QUEUE_HOST=redis-queue
      - REDIS_QUEUE_PORT=6379
      - TZ=Asia/Seoul
    volumes:
      - ./logs:/usr/src/app/logs
    depends_on:
      - postgres
      - redis-cache
      - redis-queue
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tech-trends-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_DATABASE:-tech_trends}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis-cache:
    image: redis:7-alpine
    container_name: tech-trends-redis-cache
    expose:
      - "6379"
    environment:
      - TZ=Asia/Seoul
    command: >-
      redis-server --appendonly no --save '' --maxmemory 192mb
      --maxmemory-policy allkeys-lru
    restart: always

  redis-queue:
    image: redis:7-alpine
    container_name: tech-trends-redis-queue
    expose:
      - "6379"
    environment:
      - TZ=Asia/Seoul
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction
    volumes:
      - redis_queue_data:/data
    restart: always

volumes:
  postgres_data:
  redis_queue_data:
