version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tech-trends-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-trends-backend
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/usr/src/app/logs
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tech-trends-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_DATABASE:-tech_trends}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    restart: always

  redis:
    image: redis:7-alpine
    container_name: tech-trends-redis
    expose:
      - "6379"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: always

volumes:
  postgres_data:
  redis_data: