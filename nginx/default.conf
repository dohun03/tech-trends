# NestJS 백엔드 서비스
upstream backend_service {
    server backend:3000;
    keepalive 32; # Nginx <-> NestJS 커넥션 32개 유지
}

# 웹소켓 요청일 때만 Connection "upgrade" 설정
map $http_upgrade $connection_upgrade {
    default keep-alive;
    ''      close;
    '~.+'   upgrade;
}

server {
    listen 80;
    listen 443 ssl;
    server_name techtrends.devsystem.fyi localhost;

    # Cloudflare 원본 인증서 경로 설정
    ssl_certificate /etc/nginx/certs/cloudflare.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # SSL 세션 및 프로토콜 최적화 (지연 완벽 차단)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # 정적 파일 서빙 (프론트엔드)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 프록시
    location /api/ {
        proxy_pass http://backend_service;

        # HTTP 1.1 사용
        proxy_http_version 1.1;
        
        # [핵심 수정] 일반 HTTP 요청에 Connection "upgrade" 락이 걸리지 않도록 map 변수 적용
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}